<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Lab — Кодта, жаса, үйрен!</title>
<style>
:root{
  --bg:#f4fdf8; --white:#ffffff;
  --emerald:#10b981; --emerald-dark:#047857; --emerald-light:#d1fae5;
  --cyan:#06b6d4; --cyan-light:#cffafe;
  --yellow:#fbbf24; --yellow-light:#fef3c7;
  --code:#16241f; --code-line:#1f332c; --code-text:#a7f3d0;
  --ok:#ecfdf5; --okb:#6ee7b7;
  --warn:#fff7ed; --warnb:#fdba74;
  --text:#0f2b23; --muted:#5b7a70; --border:#d7ebe2;
  --radius:16px; --shadow:0 6px 24px rgba(6,95,70,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.65; font-size:16px;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--emerald-dark)}
button{font-family:inherit}

/* ---------- HEADER ---------- */
header.top{
  background:linear-gradient(120deg,#0ea472 0%,#10b981 45%,#06b6d4 100%);
  color:#fff; padding:16px 20px; display:flex; align-items:center; gap:14px;
  flex-wrap:wrap; justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{
  width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:24px;backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.35)
}
.logo h1{font-size:22px;letter-spacing:1.5px;font-weight:800}
.logo p{font-size:12.5px;opacity:.92}
.top-stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3);
  padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap
}

/* ---------- NAV ---------- */
nav.main{
  background:#fff; border-bottom:1px solid var(--border); display:flex; gap:6px;
  overflow-x:auto; padding:9px 14px; position:sticky; top:0; z-index:60;
  box-shadow:0 2px 14px rgba(6,95,70,.05); scrollbar-width:thin;
}
nav.main a{
  padding:8px 15px; border-radius:999px; text-decoration:none; color:var(--muted);
  font-size:14px; white-space:nowrap; font-weight:600; transition:.15s;
}
nav.main a:hover{background:var(--emerald-light);color:var(--emerald-dark)}
nav.main a.active{background:var(--emerald);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.3)}

/* ---------- LAYOUT ---------- */
main{max-width:1220px;margin:0 auto;padding:22px 16px 70px}
.page-head{margin-bottom:20px}
.page-head h2{font-size:26px;color:var(--emerald-dark);letter-spacing:.3px}
.page-head p{color:var(--muted);font-size:15px;margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

.card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.card h3{font-size:18px;color:var(--emerald-dark);margin-bottom:10px}
.card h4{font-size:15.5px;margin:14px 0 6px;color:var(--emerald-dark)}
.card p{margin-bottom:9px;font-size:15px}
.card ul,.card ol{margin:8px 0 12px 22px;font-size:15px}
.card li{margin-bottom:5px}

.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--emerald);color:#fff;border:none;padding:11px 20px;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;transition:.15s;text-decoration:none;
}
.btn:hover{background:var(--emerald-dark);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.sec{background:#fff;color:var(--emerald-dark);border:2px solid var(--emerald-light)}
.btn.sec:hover{background:var(--emerald-light)}
.btn.cy{background:var(--cyan)}.btn.cy:hover{background:#0891b2}
.btn.ye{background:var(--yellow);color:#6b4600}.btn.ye:hover{background:#f59e0b}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.badge{
  display:inline-block;padding:3px 11px;border-radius:999px;font-size:12.5px;
  font-weight:700;background:var(--emerald-light);color:var(--emerald-dark)
}
.badge.cy{background:var(--cyan-light);color:#0e7490}
.badge.ye{background:var(--yellow-light);color:#92400e}

/* ---------- HOME ---------- */
.hero{
  background:linear-gradient(135deg,#ffffff 0%,#ecfdf5 55%,#cffafe 100%);
  border:1px solid var(--border); border-radius:24px; padding:38px 28px; text-align:center;
  box-shadow:var(--shadow); margin-bottom:24px; position:relative; overflow:hidden;
}
.hero::after{
  content:'';position:absolute;inset:auto -60px -90px auto;width:260px;height:260px;
  background:radial-gradient(circle,rgba(251,191,36,.28),transparent 70%);border-radius:50%
}
.hero h2{font-size:clamp(30px,6vw,52px);letter-spacing:4px;color:var(--emerald-dark);font-weight:900}
.hero .slogan{font-size:clamp(15px,2.4vw,19px);color:#0e7490;font-weight:600;margin:12px 0 22px}
.hero .btn-row{justify-content:center}

.module-card{
  border-radius:var(--radius);padding:22px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;transition:.2s;border:none;text-align:left;width:100%
}
.module-card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(6,95,70,.18)}
.module-card.py{background:linear-gradient(135deg,#059669,#10b981)}
.module-card.doc{background:linear-gradient(135deg,#0891b2,#06b6d4)}
.module-card h3{color:#fff;font-size:21px;margin-bottom:8px}
.module-card ul{margin:10px 0 0 20px;font-size:14.5px;opacity:.96}
.module-card li{margin-bottom:4px}

/* ---------- CODE ---------- */
pre.code{
  background:var(--code);color:var(--code-text);padding:16px 18px;border-radius:14px;
  overflow-x:auto;font-family:'Consolas','Fira Code',monospace;font-size:14px;
  line-height:1.65;border:1px solid #24463b;margin:10px 0
}
pre.code .cm{color:#6b8f80}
code.inline{background:var(--emerald-light);color:var(--emerald-dark);padding:2px 7px;border-radius:6px;font-family:Consolas,monospace;font-size:14px}

/* ---------- EDITOR ---------- */
.editor-layout{display:grid;grid-template-columns:250px 1fr 1fr;gap:14px;align-items:start}
@media(max-width:1050px){.editor-layout{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{
  padding:10px 15px;font-weight:700;font-size:14px;background:var(--emerald-light);
  color:var(--emerald-dark);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap
}
.panel-body{padding:14px}
textarea#pycode{
  width:100%;height:390px;background:var(--code);color:var(--code-text);border:none;outline:none;
  padding:14px;font-family:'Consolas','Fira Code',monospace;font-size:14.5px;line-height:1.6;
  resize:vertical;tab-size:4;display:block
}
.canvas-wrap{position:relative;background:#fff;height:390px}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#turtleOverlay{pointer-events:none}
.console{
  background:#0f1d19;color:#a7f3d0;font-family:Consolas,monospace;font-size:13.5px;
  padding:11px 14px;max-height:150px;overflow:auto;border-top:1px solid #24463b;white-space:pre-wrap
}
.console .err{color:#fca5a5}
.console .ok{color:#86efac}
.ref-item{font-size:13.4px;padding:6px 0;border-bottom:1px dashed var(--border)}
.ref-item code{color:var(--emerald-dark);font-weight:700;font-family:Consolas,monospace}

/* ---------- TASKS ---------- */
.task-box{background:var(--ok);border:1.5px solid var(--okb);border-radius:14px;padding:16px;margin-top:14px}
.task-box h4{color:var(--emerald-dark);margin-bottom:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:44px}
.item{
  background:#fff;border:2px solid var(--border);border-radius:11px;padding:8px 14px;
  cursor:pointer;font-size:14.3px;transition:.15s;user-select:none;font-weight:500
}
.item:hover{border-color:var(--emerald)}
.item.sel{border-color:var(--yellow);background:var(--yellow-light);box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.cats{grid-template-columns:1fr}}
.cat{
  background:#fff;border:2px dashed var(--border);border-radius:13px;padding:12px;min-height:96px
}
.cat h5{font-size:14px;color:var(--emerald-dark);margin-bottom:8px}
.cat.over{border-color:var(--emerald);background:var(--ok)}
.order-list{list-style:none;margin:10px 0}
.order-list li{
  background:#fff;border:2px solid var(--border);border-radius:11px;padding:9px 12px;
  margin-bottom:7px;display:flex;align-items:center;gap:10px;font-size:14.4px
}
.order-list li .num{width:26px;height:26px;border-radius:50%;background:var(--emerald-light);color:var(--emerald-dark);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.order-list li .mv{margin-left:auto;display:flex;gap:5px}
.order-list li .mv button{border:1px solid var(--border);background:#fff;border-radius:7px;width:28px;height:28px;cursor:pointer;font-weight:700;color:var(--emerald-dark)}
.result-msg{margin-top:11px;padding:10px 13px;border-radius:11px;font-size:14.4px;font-weight:600}
.result-msg.ok{background:var(--ok);border:1.5px solid var(--okb);color:var(--emerald-dark)}
.result-msg.no{background:var(--warn);border:1.5px solid var(--warnb);color:#9a3412}

/* ---------- TESTS ---------- */
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--border);
  border-radius:12px;padding:12px 16px;margin-bottom:9px;cursor:pointer;font-size:15px;
  transition:.15s;font-family:inherit;color:var(--text)
}
.opt:hover:not(:disabled){border-color:var(--emerald);background:var(--ok)}
.opt.correct{border-color:var(--emerald);background:var(--ok);font-weight:700}
.opt.wrong{border-color:#f87171;background:#fef2f2}
.opt:disabled{cursor:default}
.progress-bar{height:9px;background:var(--emerald-light);border-radius:999px;overflow:hidden;margin:10px 0 18px}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--emerald),var(--cyan));transition:.35s;border-radius:999px}

/* ---------- DOC / TABLE ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:9px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.toolbar button{
  background:#fff;border:1px solid var(--border);border-radius:9px;padding:7px 11px;
  cursor:pointer;font-size:13.6px;font-weight:600;color:var(--muted);transition:.15s
}
.toolbar button:hover{background:var(--emerald-light);color:var(--emerald-dark);border-color:var(--emerald)}
.toolbar select{border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:13.6px;font-family:inherit;background:#fff}
#docArea{
  min-height:430px;background:#fff;border:1px solid var(--border);border-radius:14px;
  padding:30px;outline:none;font-size:15.5px;line-height:1.8;box-shadow:var(--shadow)
}
#docArea h1{font-size:26px;margin-bottom:12px;color:var(--emerald-dark)}
#docArea h2{font-size:21px;margin:14px 0 8px;color:var(--emerald-dark)}
#docArea ul,#docArea ol{margin-left:24px;margin-bottom:10px}
#docArea img{max-width:100%;border-radius:10px}

table.editor{border-collapse:collapse;width:100%;background:#fff}
table.editor td{
  border:1px solid #b9d9cc;padding:8px 10px;min-width:70px;height:38px;
  font-size:14.3px;vertical-align:top;cursor:pointer;outline:none
}
table.editor td.sel{background:var(--yellow-light);box-shadow:inset 0 0 0 2px var(--yellow)}

/* ---------- RESULTS ---------- */
.ach{
  display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--border);
  border-radius:14px;padding:13px 15px;opacity:.5;transition:.2s
}
.ach.got{opacity:1;border-color:var(--okb);background:var(--ok);box-shadow:0 5px 18px rgba(16,185,129,.13)}
.ach .ico{font-size:27px;flex:none}
.ach b{display:block;font-size:14.6px;color:var(--emerald-dark)}
.ach span{font-size:12.8px;color:var(--muted)}

.stat{text-align:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 10px}
.stat b{display:block;font-size:29px;color:var(--emerald);font-weight:800}
.stat span{font-size:13px;color:var(--muted)}

footer.foot{
  text-align:center;padding:26px 16px;color:var(--muted);font-size:13.4px;
  border-top:1px solid var(--border);background:#fff;margin-top:30px
}
.hidden{display:none!important}
.note{background:var(--yellow-light);border-left:4px solid var(--yellow);padding:11px 14px;border-radius:0 11px 11px 0;font-size:14.4px;margin:10px 0}
</style>
</head>
<body>

<header class="top">
  <div class="logo">
    <div class="mark">🧪</div>
    <div>
      <h1>DIGITAL LAB</h1>
      <p>Код жаз. Сурет сал. Құжат жаса. Цифрлық әлемді зертте!</p>
    </div>
  </div>
  <div class="top-stats">
    <div class="chip" id="chipProgress">📈 Прогресс: 0%</div>
    <div class="chip" id="chipAch">🏆 Жетістік: 0/6</div>
  </div>
</header>

<nav class="main" id="mainnav"></nav>
<main id="app"></main>
<footer class="foot">Digital Lab — 5-сынып информатикасы · Интерактивті оқу платформасы</footer>

<script>
"use strict";
/* =========================================================================
   0. КӨМЕКШІ ФУНКЦИЯЛАР
   ========================================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');

/* =========================================================================
   1. ПРОГРЕСС (localStorage)
   ========================================================================= */
const Store = {
  key: 'digitalLab_v1',
  data: null,
  load(){
    try { this.data = JSON.parse(localStorage.getItem(this.key)) || null; } catch(e){ this.data = null; }
    if(!this.data) this.data = {topics:[], tests:{}, final:null, ach:[], practice:[], editorRuns:0, docSaved:0, tables:0};
    ['topics','ach','practice'].forEach(k => { if(!Array.isArray(this.data[k])) this.data[k]=[]; });
    return this.data;
  },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }catch(e){} this.updateChips(); },
  updateChips(){
    const d = this.data;
    const total = PY_TOPICS.length + DOC_TOPICS.length;
    const doneT = d.topics.length;
    const testsDone = Object.keys(d.tests).length;
    const totalUnits = total + 10 + 12; // тақырып + тест + практика
    const done = doneT + testsDone + d.practice.length + (d.final?1:0);
    const pct = Math.min(100, Math.round(done / totalUnits * 100));
    const c1 = $('#chipProgress'); if(c1) c1.textContent = '📈 Прогресс: ' + pct + '%';
    const c2 = $('#chipAch'); if(c2) c2.textContent = '🏆 Жетістік: ' + d.ach.length + '/6';
  },
  has(arr, v){ return this.data[arr].indexOf(v) >= 0; },
  add(arr, v){ if(!this.has(arr, v)){ this.data[arr].push(v); this.save(); } }
};

/* =========================================================================
   2. PYTHON + TURTLE ИНТЕРПРЕТАТОРЫ
   ========================================================================= */
class PError extends Error{
  constructor(msg, line){ super(msg); this.line = line || 0; this.isP = true; }
}

/* ---------- Токенизатор ---------- */
function stripComment(line){
  let out = '', inStr = null;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inStr){ out += c; if(c === inStr && line[i-1] !== '\\') inStr = null; }
    else if(c === '"' || c === "'"){ inStr = c; out += c; }
    else if(c === '#') break;
    else out += c;
  }
  return out;
}

function tokenize(src){
  const lines = String(src).replace(/\r/g,'').split('\n');
  const toks = [], indents = [0];
  let depth = 0;
  const push = (t,v,line) => toks.push({t, v, line});

  for(let ln=0; ln<lines.length; ln++){
    const raw = stripComment(lines[ln]);
    if(raw.trim() === '') continue;
    let i = 0, ind = 0;
    while(i < raw.length && (raw[i] === ' ' || raw[i] === '\t')){ ind += raw[i] === '\t' ? 4 : 1; i++; }
    if(depth === 0){
      const cur = indents[indents.length-1];
      if(ind > cur){ indents.push(ind); push('INDENT', null, ln+1); }
      else if(ind < cur){
        while(indents.length > 1 && ind < indents[indents.length-1]){ indents.pop(); push('DEDENT', null, ln+1); }
        if(ind !== indents[indents.length-1])
          throw new PError(`Шегініс дұрыс емес (${ln+1}-жол). Блок ішіндегі жолдарды бірдей шегіндір.`, ln+1);
      }
    }
    while(i < raw.length){
      const c = raw[i];
      if(c === ' ' || c === '\t'){ i++; continue; }
      if(c === '#') break;
      if(c === '"' || c === "'"){
        i++; let s = '';
        while(i < raw.length && raw[i] !== c){
          if(raw[i] === '\\' && i+1 < raw.length){ i++; s += raw[i] === 'n' ? '\n' : raw[i]; }
          else s += raw[i];
          i++;
        }
        if(i >= raw.length) throw new PError(`Жабылмаған тырнақша (${ln+1}-жол)`, ln+1);
        i++; push('STR', s, ln+1); continue;
      }
      if(/[0-9]/.test(c)){
        let s = '';
        while(i < raw.length && /[0-9.]/.test(raw[i])){ s += raw[i]; i++; }
        push('NUM', parseFloat(s), ln+1); continue;
      }
      if(/[A-Za-z_\u0400-\u04FF]/.test(c)){
        let s = '';
        while(i < raw.length && /[A-Za-z0-9_\u0400-\u04FF]/.test(raw[i])){ s += raw[i]; i++; }
        push('ID', s, ln+1); continue;
      }
      const two = raw.substr(i,2);
      if(['==','!=','<=','>=','//','**','+=','-='].includes(two)){ push('OP', two, ln+1); i += 2; continue; }
      if('+-*/%<>=(),:.[]'.includes(c)){
        push('OP', c, ln+1);
        if(c === '(' || c === '[') depth++;
        if(c === ')' || c === ']') depth--;
        i++; continue;
      }
      throw new PError(`Танылмаған таңба: "${c}" (${ln+1}-жол)`, ln+1);
    }
    push('NEWLINE', null, ln+1);
  }
  while(indents.length > 1){ indents.pop(); push('DEDENT', null, lines.length); }
  push('EOF', null, lines.length);
  return toks;
}

/* ---------- Парсер ---------- */
class Parser{
  constructor(toks){ this.toks = toks; this.i = 0; }
  peek(k){ return this.toks[this.i + (k||0)] || this.toks[this.toks.length-1]; }
  next(){ return this.toks[this.i++] || this.toks[this.toks.length-1]; }
  at(t,v){ const tk = this.peek(); return tk.t === t && (v === undefined || tk.v === v); }
  expect(t,v){
    if(!this.at(t,v)){
      const tk = this.peek();
      const got = (tk.v !== undefined && tk.v !== null) ? tk.v : tk.t;
      throw new PError(`"${v || t}" күтілді, бірақ "${got}" табылды (${tk.line}-жол)`, tk.line);
    }
    return this.next();
  }
  skipNL(){ while(this.at('NEWLINE')) this.i++; }
  endLine(){ if(this.at('NEWLINE')) this.i++; }

  parseProgram(){
    const b = []; this.skipNL();
    while(!this.at('EOF')){ b.push(this.parseStatement()); this.skipNL(); }
    return b;
  }
  parseBlock(){
    if(this.at('NEWLINE')){
      this.next();
      if(!this.at('INDENT'))
        throw new PError('Блок бос: қос нүктеден (:) кейін шегініспен жазылған жол болуы керек', this.peek().line);
      this.next();
      const stmts = [];
      while(!this.at('DEDENT') && !this.at('EOF')){
        if(this.at('NEWLINE')){ this.next(); continue; }
        stmts.push(this.parseStatement());
      }
      if(this.at('DEDENT')) this.next();
      return stmts;
    }
    return [this.parseSimpleStatement()];
  }
  parseStatement(){
    const tk = this.peek();
    if(tk.t === 'ID'){
      switch(tk.v){
        case 'import': {
          this.next(); const name = this.expect('ID').v;
          if(this.at('ID','as')){ this.next(); this.expect('ID'); }
          this.endLine(); return {type:'import', name, line:tk.line};
        }
        case 'from': {
          this.next(); const name = this.expect('ID').v;
          this.expect('ID','import');
          const items = [];
          while(!this.at('NEWLINE') && !this.at('EOF')){
            const t = this.next();
            if(t.t === 'OP' && t.v === '*') items.push('*');
            else if(t.t === 'ID') items.push(t.v);
            else if(t.t === 'OP' && t.v === ',') continue;
            else break;
          }
          this.endLine(); return {type:'fromimport', name, items, line:tk.line};
        }
        case 'for': return this.parseFor();
        case 'while': return this.parseWhile();
        case 'if': return this.parseIf();
        case 'def':
          throw new PError('Бұл редакторда "def" (функция) қолдау көрсетілмейді. Цикл мен шартты қолданып көр.', tk.line);
        case 'pass': this.next(); this.endLine(); return {type:'pass', line:tk.line};
        case 'break': this.next(); this.endLine(); return {type:'break', line:tk.line};
        case 'continue': this.next(); this.endLine(); return {type:'continue', line:tk.line};
      }
    }
    return this.parseSimpleStatement();
  }
  parseSimpleStatement(){
    const line = this.peek().line;
    const e = this.parseExpr();
    if(this.at('OP','=')){
      this.next();
      const v = this.parseExpr();
      this.endLine();
      if(e.type !== 'var') throw new PError('Мәнді тек айнымалыға беруге болады', line);
      return {type:'assign', name:e.name, value:v, line};
    }
    if(this.at('OP','+=') || this.at('OP','-=')){
      const op = this.next().v[0];
      const v = this.parseExpr(); this.endLine();
      if(e.type !== 'var') throw new PError('Тек айнымалыны өзгертуге болады', line);
      return {type:'assign', name:e.name, value:{type:'bin', op, l:e, r:v, line}, line};
    }
    this.endLine();
    return {type:'expr', expr:e, line};
  }
  parseFor(){
    const line = this.peek().line;
    this.expect('ID','for');
    const v = this.expect('ID').v;
    this.expect('ID','in');
    const iter = this.parseExpr();
    this.expect('OP',':');
    const body = this.parseBlock();
    return {type:'for', varName:v, iter, body, line};
  }
  parseWhile(){
    const line = this.peek().line;
    this.expect('ID','while');
    const cond = this.parseExpr();
    this.expect('OP',':');
    const body = this.parseBlock();
    return {type:'while', cond, body, line};
  }
  parseIf(){
    const line = this.peek().line;
    this.expect('ID','if');
    const cond = this.parseExpr();
    this.expect('OP',':');
    const body = this.parseBlock();
    const root = {type:'if', cond, body, orelse:null, line};
    let cur = root;
    for(;;){
      if(this.at('ID','elif')){
        const l2 = this.next().line;
        const c2 = this.parseExpr(); this.expect('OP',':');
        const b2 = this.parseBlock();
        const nn = {type:'if', cond:c2, body:b2, orelse:null, line:l2};
        cur.orelse = [nn]; cur = nn;
      } else if(this.at('ID','else')){
        this.next(); this.expect('OP',':');
        cur.orelse = this.parseBlock();
        break;
      } else break;
    }
    return root;
  }
  /* --- Өрнектер --- */
  parseExpr(){ return this.parseOr(); }
  parseOr(){
    let l = this.parseAnd();
    while(this.at('ID','or')){ this.next(); l = {type:'bin', op:'or', l, r:this.parseAnd()}; }
    return l;
  }
  parseAnd(){
    let l = this.parseNot();
    while(this.at('ID','and')){ this.next(); l = {type:'bin', op:'and', l, r:this.parseNot()}; }
    return l;
  }
  parseNot(){
    if(this.at('ID','not')){ this.next(); return {type:'un', op:'not', e:this.parseNot()}; }
    return this.parseCmp();
  }
  parseCmp(){
    let l = this.parseAdd();
    while(this.at('OP') && ['==','!=','<','>','<=','>='].includes(this.peek().v)){
      const op = this.next().v;
      l = {type:'bin', op, l, r:this.parseAdd()};
    }
    return l;
  }
  parseAdd(){
    let l = this.parseMul();
    while(this.at('OP') && (this.peek().v === '+' || this.peek().v === '-')){
      const op = this.next().v;
      l = {type:'bin', op, l, r:this.parseMul()};
    }
    return l;
  }
  parseMul(){
    let l = this.parseUnary();
    while(this.at('OP') && ['*','/','//','%'].includes(this.peek().v)){
      const op = this.next().v;
      l = {type:'bin', op, l, r:this.parseUnary()};
    }
    return l;
  }
  parseUnary(){
    if(this.at('OP','-')){ this.next(); return {type:'un', op:'-', e:this.parseUnary()}; }
    if(this.at('OP','+')){ this.next(); return this.parseUnary(); }
    return this.parsePrimary();
  }
  parseArgs(){
    this.expect('OP','(');
    const args = [];
    if(!this.at('OP',')')){
      for(;;){
        args.push(this.parseExpr());
        if(this.at('OP',',')){ this.next(); continue; }
        break;
      }
    }
    this.expect('OP',')');
    return args;
  }
  parsePrimary(){
    const tk = this.next();
    const line = tk.line;
    if(tk.t === 'NUM') return {type:'num', v:tk.v, line};
    if(tk.t === 'STR') return {type:'str', v:tk.v, line};
    if(tk.t === 'ID'){
      if(tk.v === 'True') return {type:'num', v:true, line};
      if(tk.v === 'False') return {type:'num', v:false, line};
      if(tk.v === 'None') return {type:'num', v:0, line};
      let node = {type:'var', name:tk.v, line};
      while(this.at('OP','.')){
        this.next();
        const p = this.expect('ID');
        node = {type:'member', obj:node, name:p.v, line};
      }
      if(this.at('OP','(')) node = {type:'call', callee:node, args:this.parseArgs(), line};
      return node;
    }
    if(tk.t === 'OP' && tk.v === '('){
      const e = this.parseExpr();
      this.expect('OP',')');
      return e;
    }
    if(tk.t === 'OP' && tk.v === '['){
      const items = [];
      if(!this.at('OP',']')){
        for(;;){
          items.push(this.parseExpr());
          if(this.at('OP',',')){ this.next(); continue; }
          break;
        }
      }
      this.expect('OP',']');
      return {type:'list', items, line};
    }
    throw new PError(`Түсініксіз өрнек: "${tk.v !== undefined && tk.v !== null ? tk.v : tk.t}" (${line}-жол)`, line);
  }
}

/* ---------- Turtle симуляторы ---------- */
class TurtleSim{
  constructor(){
    this.maxSteps = 30000;
    this.resetAll();
  }
  resetAll(){
    this.bgcolor = '#ffffff';
    this.ops = [];
    this.steps = 0;
    this.x = 0; this.y = 0; this.heading = 0;
    this.penDown = true;
    this.penColor = '#0f2b23';
    this.fillColor = '#10b981';
    this.penSize = 2;
    this.speed = 5;
    this.shape = 'classic';
    this.visible = true;
    this.fillPts = null; this.fillIndex = -1;
    this.turtleTrail = []; // {x,y,h}
  }
  clear(){ this.ops = []; this.steps = 0; this.x = 0; this.y = 0; this.heading = 0; }
  _chk(){
    if(++this.steps > this.maxSteps)
      throw new PError('Тасбақа тым көп әрекет орындады. Шексіз цикл болуы мүмкін — цикл шартын тексер.', 0);
  }
  _push(op){ this.ops.push(op); }
  _mark(){ this.turtleTrail.push({x:this.x, y:this.y, h:this.heading}); }
  _moveTo(nx, ny){
    this._chk();
    if(this.penDown && (Math.abs(nx-this.x) > 1e-9 || Math.abs(ny-this.y) > 1e-9)){
      this._push({type:'line', x1:this.x, y1:this.y, x2:nx, y2:ny,
                  color:this.penColor, width:this.penSize, h:this.heading});
    }
    this.x = nx; this.y = ny;
    if(this.fillPts) this.fillPts.push({x:nx, y:ny});
    this._mark();
  }
  forward(d){
    d = +d || 0;
    const r = this.heading * Math.PI / 180;
    this._moveTo(this.x + d*Math.cos(r), this.y + d*Math.sin(r));
  }
  backward(d){ this.forward(-(+d || 0)); }
  right(a){ this.heading -= (+a || 0); this._mark(); }
  left(a){ this.heading += (+a || 0); this._mark(); }
  goto(x, y){ this._moveTo(+x || 0, +y || 0); }
  setHeading(a){ this.heading = +a || 0; this._mark(); }
  home(){
    this.heading = 0;
    this._moveTo(0, 0);
  }
  penUp(){ this.penDown = false; }
  penDownFn(){ this.penDown = true; }
  beginFill(){ this.fillPts = [{x:this.x, y:this.y}]; this.fillIndex = this.ops.length; }
  endFill(){
    if(this.fillPts && this.fillPts.length > 2){
      this.ops.splice(this.fillIndex, 0, {type:'fill', pts:this.fillPts.slice(), color:this.fillColor});
    }
    this.fillPts = null; this.fillIndex = -1;
  }
  circle(r, extent){
    r = +r || 0; extent = (extent === undefined ? 360 : +extent);
    const n = Math.max(8, Math.round(Math.abs(extent) / 5));
    const stepAngle = extent / n;
    const stepLen = 2 * Math.PI * Math.abs(r) * Math.abs(stepAngle) / 360;
    const dir = r >= 0 ? 1 : -1;
    for(let i=0;i<n;i++){
      this.forward(stepLen);
      this.heading += stepAngle * dir;
    }
    this._mark();
  }
  dot(size){
    this._chk();
    this._push({type:'dot', x:this.x, y:this.y, r:(+size || 6)/2, color:this.penColor});
  }
  write(text){
    this._chk();
    this._push({type:'text', x:this.x, y:this.y, text:String(text), color:this.penColor});
  }
}

/* ---------- Turtle нысаны (Python-ға ұқсас API) ---------- */
function makeTurtleObject(sim){
  const n = v => { const x = Number(v); if(isNaN(x)) throw new PError('Сандық мән күтілді'); return x; };
  const t = {};
  t.forward = t.fd = d => sim.forward(n(d));
  t.backward = t.bk = t.back = d => sim.backward(n(d));
  t.right = t.rt = a => sim.right(n(a));
  t.left = t.lt = a => sim.left(n(a));
  t.goto = t.setpos = t.setposition = (x,y) => sim.goto(n(x), n(y));
  t.setheading = t.seth = a => sim.setHeading(n(a));
  t.home = () => sim.home();
  t.penup = t.pu = t.up = () => sim.penUp();
  t.pendown = t.pd = t.down = () => sim.penDownFn();
  t.begin_fill = () => sim.beginFill();
  t.end_fill = () => sim.endFill();
  t.circle = (r,e) => sim.circle(n(r), e === undefined ? 360 : n(e));
  t.dot = s => sim.dot(s === undefined ? 6 : n(s));
  t.write = (txt) => sim.write(txt);
  t.color = t.pencolor = (a,b) => {
    if(b !== undefined){ sim.penColor = String(a); sim.fillColor = String(b); }
    else { sim.penColor = String(a); sim.fillColor = String(a); }
  };
  t.fillcolor = c => { sim.fillColor = String(c); };
  t.pensize = t.width = w => { sim.penSize = Math.max(1, n(w)); };
  t.speed = s => { sim.speed = n(s); };
  t.shape = s => { sim.shape = String(s); };
  t.hideturtle = t.ht = () => { sim.visible = false; };
  t.showturtle = t.st = () => { sim.visible = true; };
  t.clear = () => { sim.ops = []; };
  t.reset = () => { sim.clear(); };
  t.xcor = () => sim.x;
  t.ycor = () => sim.y;
  t.heading = () => sim.heading;
  return t;
}

/* ---------- Модуль ---------- */
function makeTurtleModule(sim){
  const def = makeTurtleObject(sim);
  const mod = {};
  mod.Turtle = () => def;
  mod.Screen = () => ({ bgcolor: c => { sim.bgcolor = String(c); }, setup: ()=>{}, title: ()=>{} });
  mod.done = () => {};
  mod.exitonclick = () => {};
  mod.mainloop = () => {};
  mod.bye = () => {};
  mod.title = () => {};
  mod.setup = () => {};
  mod.bgcolor = c => { sim.bgcolor = String(c); };
  mod.clearscreen = () => { sim.ops = []; };
  mod.resetscreen = () => { sim.resetAll(); };
  ['forward','fd','backward','bk','back','right','rt','left','lt','goto','setpos','setposition',
   'setheading','seth','home','penup','pu','up','pendown','pd','down','begin_fill','end_fill',
   'circle','dot','write','color','pencolor','fillcolor','pensize','width','speed','shape',
   'hideturtle','ht','showturtle','st','clear','reset','xcor','ycor','heading'
  ].forEach(k => { if(def[k]) mod[k] = def[k]; });
  return mod;
}

/* ---------- Орындаушы ---------- */
function runPython(src, sim, outputs, opts){
  const toks = tokenize(src);
  const ast = new Parser(toks).parseProgram();
  const turtleModule = makeTurtleModule(sim);
  const env = Object.create(null);

  const ctl = {
    start: Date.now(),
    limit: (opts && opts.limit) || 6000,
    maxLoop: (opts && opts.maxLoop) || 20000,
    check(){
      if(Date.now() - this.start > this.limit)
        throw new PError('Код тым ұзақ орындалды. Шексіз цикл болуы мүмкін — шартты тексер.');
    }
  };

  const toNum = v => {
    if(typeof v === 'number') return v;
    if(typeof v === 'boolean') return v ? 1 : 0;
    const n = Number(v);
    if(isNaN(n)) throw new PError(`"${v}" санына айналмайды`);
    return n;
  };
  const toStr = v => (typeof v === 'boolean') ? (v ? 'True' : 'False') : String(v);
  const truthy = v => {
    if(typeof v === 'boolean') return v;
    if(typeof v === 'number') return v !== 0;
    if(typeof v === 'string') return v.length > 0;
    if(Array.isArray(v)) return v.length > 0;
    return !!v;
  };

  const builtins = {
    range: (...a) => {
      let start = 0, stop = 0, step = 1;
      if(a.length === 1) stop = toNum(a[0]);
      else if(a.length === 2){ start = toNum(a[0]); stop = toNum(a[1]); }
      else { start = toNum(a[0]); stop = toNum(a[1]); step = toNum(a[2]) || 1; }
      start = Math.trunc(start); stop = Math.trunc(stop); step = Math.trunc(step) || 1;
      const out = [];
      if(step > 0) for(let i=start;i<stop;i+=step){ out.push(i); if(out.length > 100000) break; }
      else for(let i=start;i>stop;i+=step){ out.push(i); if(out.length > 100000) break; }
      return out;
    },
    print: (...a) => { outputs.push(a.map(toStr).join(' ')); },
    int: v => { const n = parseInt(toStr(v), 10); return isNaN(n) ? 0 : n; },
    float: v => { const n = parseFloat(toStr(v)); return isNaN(n) ? 0 : n; },
    str: v => toStr(v),
    len: v => (Array.isArray(v) || typeof v === 'string') ? v.length : 0,
    abs: v => Math.abs(toNum(v)),
    round: v => Math.round(toNum(v)),
    max: (...a) => Math.max(...a.map(toNum)),
    min: (...a) => Math.min(...a.map(toNum)),
    sum: a => a.reduce((s,x) => s + toNum(x), 0),
    input: (p) => { const r = window.prompt(p === undefined ? 'Мәнді енгіз:' : toStr(p)); return r === null ? '' : r; }
  };
  Object.keys(builtins).forEach(k => env[k] = builtins[k]);

  function getMember(obj, name, line){
    if(obj === null || obj === undefined)
      throw new PError(`"${name}" әдісін қолдану мүмкін емес: нысан жоқ (${line}-жол)`, line);
    if(typeof obj === 'object' && name in obj) return obj[name];
    throw new PError(`"${name}" әдісі табылмады. Команда атауын тексер.`, line);
  }

  function evalExpr(e){
    switch(e.type){
      case 'num': return e.v;
      case 'str': return e.v;
      case 'list': return e.items.map(evalExpr);
      case 'var': {
        if(e.name in env) return env[e.name];
        if(e.name === 'turtle') return turtleModule;
        throw new PError(`"${e.name}" айнымалысы анықталмаған. Оны алдын ала жазуды ұмытпа.`, e.line);
      }
      case 'member': return getMember(evalExpr(e.obj), e.name, e.line);
      case 'un': {
        if(e.op === '-') return -toNum(evalExpr(e.e));
        if(e.op === 'not') return !truthy(evalExpr(e.e));
        return 0;
      }
      case 'bin': {
        const op = e.op;
        if(op === 'and') return truthy(evalExpr(e.l)) ? evalExpr(e.r) : false;
        if(op === 'or') return truthy(evalExpr(e.l)) ? true : evalExpr(e.r);
        const a = evalExpr(e.l), b = evalExpr(e.r);
        switch(op){
          case '+': return (typeof a === 'string' || typeof b === 'string') ? toStr(a) + toStr(b) : toNum(a) + toNum(b);
          case '-': return toNum(a) - toNum(b);
          case '*': return toNum(a) * toNum(b);
          case '/': {
            const d = toNum(b);
            if(d === 0) throw new PError('Нөлге бөлуге болмайды', e.line);
            return toNum(a) / d;
          }
          case '//': { const d = toNum(b); if(d === 0) throw new PError('Нөлге бөлуге болмайды', e.line); return Math.floor(toNum(a)/d); }
          case '%': { const d = toNum(b); if(d === 0) throw new PError('Нөлге бөлуге болмайды', e.line); return toNum(a) % d; }
          case '==': return a === b || toStr(a) === toStr(b);
          case '!=': return !(a === b || toStr(a) === toStr(b));
          case '<': return toNum(a) < toNum(b);
          case '>': return toNum(a) > toNum(b);
          case '<=': return toNum(a) <= toNum(b);
          case '>=': return toNum(a) >= toNum(b);
        }
        return 0;
      }
      case 'call': {
        ctl.check();
        const args = e.args.map(evalExpr);
        let fn, self;
        if(e.callee.type === 'var'){
          if(!(e.callee.name in env))
            throw new PError(`"${e.callee.name}" функциясы табылмады. Команда атауын тексер.`, e.line);
          fn = env[e.callee.name];
        } else if(e.callee.type === 'member'){
          self = evalExpr(e.callee.obj);
          fn = getMember(self, e.callee.name, e.line);
        } else {
          throw new PError('Функция шақыру қатесі', e.line);
        }
        if(typeof fn !== 'function')
          throw new PError(`"${e.callee.name || '?'}" — функция емес, оны шақыруға болмайды.`, e.line);
        try{
          return fn.apply(self, args);
        }catch(err){
          if(err && err.isP) throw err;
          throw new PError(`"${e.callee.name || 'команда'}" орындалмады: ${err.message}`, e.line);
        }
      }
    }
    return 0;
  }

  function execBlock(stmts){
    for(const s of stmts){
      const r = execStmt(s);
      if(r === 'break' || r === 'continue' || r === 'return') return r;
    }
    return null;
  }
  function execStmt(s){
    ctl.check();
    switch(s.type){
      case 'import': env[s.name] = (s.name === 'turtle') ? turtleModule : {}; return;
      case 'fromimport': {
        if(s.name !== 'turtle') throw new PError(`"${s.name}" модулі қолдау көрсетілмейді. Тек "turtle" бар.`, s.line);
        if(s.items.includes('*')) Object.keys(turtleModule).forEach(k => env[k] = turtleModule[k]);
        else s.items.forEach(k => {
          if(!(k in turtleModule)) throw new PError(`turtle модулінде "${k}" жоқ`, s.line);
          env[k] = turtleModule[k];
        });
        return;
      }
      case 'assign': env[s.name] = evalExpr(s.value); return;
      case 'expr': evalExpr(s.expr); return;
      case 'if': {
        if(truthy(evalExpr(s.cond))) return execBlock(s.body);
        else if(s.orelse) return execBlock(s.orelse);
        return;
      }
      case 'while': {
        let guard = 0;
        while(truthy(evalExpr(s.cond))){
          ctl.check();
          if(++guard > ctl.maxLoop)
            throw new PError('Цикл тым көп қайталанды (шексіз цикл болуы мүмкін). Шартты тексер.', s.line);
          const r = execBlock(s.body);
          if(r === 'break') break;
        }
        return;
      }
      case 'for': {
        const it = evalExpr(s.iter);
        if(!Array.isArray(it))
          throw new PError('"for" цикліне тізім немесе range() керек. Мысалы: for i in range(4):', s.line);
        if(it.length > ctl.maxLoop)
          throw new PError('Цикл тым көп қайталанады (range мәні өте үлкен).', s.line);
        for(const v of it){
          ctl.check();
          env[s.varName] = v;
          const r = execBlock(s.body);
          if(r === 'break') break;
        }
        return;
      }
      case 'pass': return;
      case 'break': return 'break';
      case 'continue': return 'continue';
    }
  }

  execBlock(ast);
  return {ops: sim.ops, bgcolor: sim.bgcolor};
}

/* =========================================================================
   3. TURTLE РЕНДЕРЛЕУШІ
   ========================================================================= */
function fitCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width));
  const h = Math.max(1, Math.round(rect.height));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {w, h, ctx};
}

function computeView(sim, w, h){
  let minX = -100, maxX = 100, minY = -70, maxY = 70;
  let any = false;
  const acc = (x, y) => {
    if(!any){ minX = maxX = x; minY = maxY = y; any = true; }
    else {
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
    }
  };
  for(const op of sim.ops){
    if(op.type === 'line'){ acc(op.x1,op.y1); acc(op.x2,op.y2); }
    else if(op.type === 'fill'){ op.pts.forEach(p => acc(p.x,p.y)); }
    else if(op.type === 'dot'){ acc(op.x,op.y); }
    else if(op.type === 'text'){ acc(op.x,op.y); }
  }
  if(!any){ minX = -160; maxX = 160; minY = -110; maxY = 110; }
  acc(0, 0);
  const bw = Math.max(maxX - minX, 20), bh = Math.max(maxY - minY, 20);
  const pad = 42;
  const scale = Math.min((w - pad*2)/bw, (h - pad*2)/bh);
  const cx = w/2 - ((minX + maxX)/2) * scale;
  const cy = h/2 + ((minY + maxY)/2) * scale;
  return {scale: Math.max(scale, 0.01), cx, cy, w, h};
}

function drawOne(ctx, op, view){
  const SX = x => view.cx + x * view.scale;
  const SY = y => view.cy - y * view.scale;
  switch(op.type){
    case 'line': {
      ctx.strokeStyle = op.color;
      ctx.lineWidth = Math.max(1, op.width * view.scale);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(SX(op.x1), SY(op.y1));
      ctx.lineTo(SX(op.x2), SY(op.y2));
      ctx.stroke();
      break;
    }
    case 'fill': {
      if(op.pts.length < 3) break;
      ctx.fillStyle = op.color;
      ctx.beginPath();
      ctx.moveTo(SX(op.pts[0].x), SY(op.pts[0].y));
      for(let i=1;i<op.pts.length;i++) ctx.lineTo(SX(op.pts[i].x), SY(op.pts[i].y));
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'dot': {
      ctx.fillStyle = op.color;
      ctx.beginPath();
      ctx.arc(SX(op.x), SY(op.y), Math.max(2, op.r * view.scale), 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'text': {
      ctx.fillStyle = op.color;
      ctx.font = Math.max(11, 12 * view.scale) + 'px Segoe UI, sans-serif';
      ctx.fillText(op.text, SX(op.x), SY(op.y));
      break;
    }
  }
}

function drawTurtleMarker(ctx, x, y, h, view, shape){
  const SX = view.cx + x * view.scale;
  const SY = view.cy - y * view.scale;
  const rad = Math.max(7, 9 * Math.min(view.scale, 1.4));
  ctx.save();
  ctx.translate(SX, SY);
  ctx.rotate(-h * Math.PI / 180);
  ctx.fillStyle = '#10b981';
  ctx.strokeStyle = '#047857';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rad*1.4, 0);
  ctx.lineTo(-rad*0.9, -rad*0.95);
  ctx.lineTo(-rad*0.35, 0);
  ctx.lineTo(-rad*0.9, rad*0.95);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

/* ---------- Интерактивті тапсырмалар ---------- */
function renderTask(box, task, key){
  if(task.type === 'category'){
    box.innerHTML = `
      <h4>${esc(task.title)}</h4>
      <p style="font-size:14px;color:var(--muted)">${esc(task.hint)}</p>
      <div class="pool" id="pool_${key}"></div>
      <div class="cats" id="cats_${key}"></div>
      <div class="btn-row">
        <button class="btn sm" data-check="1">✔️ Тексеру</button>
        <button class="btn sm sec" data-reset="1">↺ Қайта бастау</button>
      </div>
      <div class="msg"></div>`;
    const pool = $('#pool_' + key, box);
    const cats = $('#cats_' + key, box);
    let selected = null;

    const build = () => {
      pool.innerHTML = '';
      cats.innerHTML = '';
      task.items.forEach((it, i) => {
        const d = document.createElement('div');
        d.className = 'item';
        d.dataset.i = i;
        d.textContent = it.text;
        d.dataset.place = 'pool';
        pool.appendChild(d);
      });
      task.cats.forEach((c, ci) => {
        const cd = document.createElement('div');
        cd.className = 'cat';
        cd.dataset.cat = ci;
        cd.innerHTML = `<h5>${esc(c)}</h5><div class="cat-items" style="display:flex;flex-wrap:wrap;gap:6px"></div>`;
        cats.appendChild(cd);
      });
    };
    const clearSel = () => $$('.item', box).forEach(x => x.classList.remove('sel'));
    build();

    box.addEventListener('click', e => {
      const item = e.target.closest('.item');
      const cat = e.target.closest('.cat');
      if(item){
        if(item.classList.contains('sel')){ item.classList.remove('sel'); selected = null; return; }
        clearSel();
        item.classList.add('sel');
        selected = item;
        return;
      }
      if(cat && selected){
        $('.cat-items', cat).appendChild(selected);
        selected.classList.remove('sel');
        selected.dataset.place = cat.dataset.cat;
        selected = null;
        return;
      }
      if(e.target.closest('[data-check]')){
        let ok = 0, total = task.items.length, bad = [];
        $$('.item', box).forEach(it => {
          if(it.dataset.place === 'pool'){ bad.push(it.textContent); return; }
          const correct = String(task.items[+it.dataset.i].cat);
          if(it.dataset.place === correct) ok++;
          else bad.push(it.textContent);
        });
        const msg = $('.msg', box);
        if(ok === total){
          msg.className = 'result-msg ok';
          msg.textContent = `🎉 Тамаша! Барлығы дұрыс: ${ok}/${total}.`;
        } else {
          msg.className = 'result-msg no';
          msg.textContent = `Дұрыс: ${ok}/${total}. Қайта тексеріңіз: ${bad.slice(0,3).join(', ')}${bad.length>3?'...':''}`;
        }
      }
      if(e.target.closest('[data-reset]')){
        selected = null;
        $('.msg', box).textContent = '';
        build();
      }
    });
  }

  else if(task.type === 'order'){
    box.innerHTML = `
      <h4>${esc(task.title)}</h4>
      <p style="font-size:14px;color:var(--muted)">${esc(task.hint)}</p>
      <ul class="order-list" id="ord_${key}"></ul>
      <div class="btn-row"><button class="btn sm" data-check="1">✔️ Тексеру</button></div>
      <div class="msg"></div>`;
    const ul = $('#ord_' + key, box);
    let arr = task.steps.slice();
    // кездейсоқ ретпен (дұрыс болып қалмауы үшін)
    if(arr.join('|') === task.correct.join('|')) arr = arr.slice().reverse();
    const draw = () => {
      ul.innerHTML = arr.map((s, i) => `
        <li><span class="num">${i+1}</span><span>${esc(s)}</span>
        <span class="mv">
          <button data-up="${i}" ${i===0?'disabled':''}>▲</button>
          <button data-dn="${i}" ${i===arr.length-1?'disabled':''}>▼</button>
        </span></li>`).join('');
    };
    draw();
    ul.addEventListener('click', e => {
      const b = e.target.closest('button');
      if(!b) return;
      const i = +(b.dataset.up !== undefined ? b.dataset.up : b.dataset.dn);
      if(b.dataset.up !== undefined && i > 0){ [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; }
      if(b.dataset.dn !== undefined && i < arr.length-1){ [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; }
      draw();
    });
    $('[data-check]', box).addEventListener('click', () => {
      const msg = $('.msg', box);
      const ok = arr.join('|') === task.correct.join('|');
      msg.className = 'result-msg ' + (ok ? 'ok' : 'no');
      msg.textContent = ok ? '🎉 Дұрыс! Қадамдар реті дұрыс орналастырылды.' : '🤔 Әлі дұрыс емес. Ойланып, қайта көріңіз.';
    });
  }

  else if(task.type === 'choice'){
    box.innerHTML = `
      <h4>${esc(task.title)}</h4>
      <p style="font-size:14px;color:var(--muted)">${esc(task.hint)}</p>
      <p style="font-weight:600;margin:10px 0">${esc(task.q)}</p>
      <div class="opts"></div>
      <div class="msg"></div>`;
    const opts = $('.opts', box);
    task.options.forEach(o => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = o.t;
      b.addEventListener('click', () => {
        $$('.opt', box).forEach(x => x.disabled = true);
        b.classList.add(o.ok ? 'correct' : 'wrong');
        const msg = $('.msg', box);
        msg.className = 'result-msg ' + (o.ok ? 'ok' : 'no');
        msg.textContent = (o.ok ? '✅ ' : '❌ ') + o.msg;
      });
      opts.appendChild(b);
    });
  }

  else if(task.type === 'code'){
    box.innerHTML = `
      <h4>${esc(task.title)}</h4>
      <p style="font-size:14px;color:var(--muted)">${esc(task.hint)}</p>
      <div class="btn-row">
        <button class="btn sm cy" data-load="1">⌨️ Редакторға жүктеп, ашу</button>
      </div>`;
    $('[data-load]', box).addEventListener('click', () => {
      localStorage.setItem('dl_code', task.template);
      localStorage.setItem('dl_pending_check', JSON.stringify(task.rules.map(r => ({src:r.re.source, flags:r.re.flags, msg:r.msg}))));
      location.hash = '/editor';
    });
  }
}

function pageEditor(){

    <div class="panel">

        <span style="display:flex;gap:6px;flex-wrap:wrap">
          <select id="tplSel" style="border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:13px">
            <option value="">— Үлгі таңдау —</option>
            ${Object.keys(TEMPLATES).map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
          </select>
        </span>
      </div>
      <textarea id="pycode" spellcheck="false"></textarea>
      <div class="console" id="console">// Нәтиже осында шығады</div>
      <div class="panel-body" style="padding:10px">
        <div class="btn-row" style="margin-top:0">
          <button class="btn" id="runBtn">▶️ Іске қосу</button>
          <button class="btn sec" id="resetBtn">↺ Бастапқы қалыпқа</button>
          <button class="btn sec" id="clearBtn">🧹 Алаңды тазалау</button>

    <div class="panel">

  sim = new TurtleSim();
  const ta = $('#pycode');
  ta.value = localStorage.getItem('dl_code') || TEMPLATES['Шаршы'];
  ta.addEventListener('input', () => localStorage.setItem('dl_code', ta.value));
  ta.addEventListener('keydown', e => {
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0,s) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
    }
  });

  $('#tplSel').addEventListener('change', e => {
    const k = e.target.value;
    if(k && TEMPLATES[k]){
      ta.value = TEMPLATES[k];
      localStorage.setItem('dl_code', ta.value);
      e.target.value = '';
    }
  });

  // Тапсырма талаптары
  const pend = localStorage.getItem('dl_pending_check');
  if(pend){
    try{
      const rules = JSON.parse(pend);
      const h = $('#taskHint');
      h.style.display = 'block';
      h.innerHTML = '<b>📋 Тапсырма талаптары:</b><br>' + rules.map(r => '• ' + esc(r.msg)).join('<br>');
    }catch(e){}
  }

  const run = () => {
    if(animHandle) cancelAnimationFrame(animHandle);
    sim = new TurtleSim();
    const outputs = [];
    const consoleEl = $('#console');
    consoleEl.innerHTML = '';
    const t0 = performance.now();
    let error = null;
    try{
      runPython(ta.value, sim, outputs);
    }catch(err){
      error = err;
    }
    outputs.forEach(o => {
      const d = document.createElement('div');
      d.textContent = '> ' + o;
      consoleEl.appendChild(d);
    });

    if(error){
      const d = document.createElement('div');
      d.className = 'err';
      d.textContent = '❌ ' + (error.isP ? error.message : ('Орындалу қатесі: ' + error.message));
      consoleEl.appendChild(d);
      renderStatic();
      return;
    }

    const ms = Math.round(performance.now() - t0);
    const ok = document.createElement('div');
    ok.className = 'ok';
    ok.textContent = `✅ Код сәтті орындалды! (${sim.ops.length} әрекет, ${ms} мс)`;
    consoleEl.appendChild(ok);

    // Прогресс / жетістіктер
    const d = Store.data;
    d.editorRuns = (d.editorRuns || 0) + 1;
    if(d.editorRuns >= 1) Store.add('ach','a1');
    if(sim.ops.some(o => o.type === 'line')) Store.add('ach','a2');
    if(/for\s+\w+\s+in\s+range/.test(ta.value) && sim.ops.length > 8) Store.add('ach','a3');
    Store.save();
    checkAchievements();

    // Тапсырма талаптарын тексеру
    if(pend){
      try{
        const rules = JSON.parse(pend);
        const missing = rules.filter(r => !(new RegExp(r.src, r.flags)).test(ta.value));
        const d2 = document.createElement('div');
        if(missing.length === 0){
          d2.className = 'ok';
          d2.textContent = '🎉 Тапсырманың барлық талаптары орындалды!';
          localStorage.removeItem('dl_pending_check');
          $('#taskHint').style.display = 'none';
        } else {
          d2.className = 'err';
          d2.textContent = '⚠️ Жетіспейді: ' + missing.map(m => m.msg).join('; ');
        }
        consoleEl.appendChild(d2);
      }catch(e){}
    }

    animate();
  };

  const renderStatic = () => {
    const cv = $('#turtleCanvas'), ov = $('#turtleOverlay');
    const {w,h,ctx} = fitCanvas(cv);
    const {w:ow,h:oh} = fitCanvas(ov);
    const octx = ov.getContext('2d');
    octx.clearRect(0,0,ow,oh);
    ctx.fillStyle = sim.bgcolor || '#ffffff';
    ctx.fillRect(0,0,w,h);
    const view = computeView(sim, w, h);
    drawGrid(ctx, view);
    sim.ops.forEach(op => drawOne(ctx, op, view));
    drawTurtleMarker(octx, sim.x, sim.y, sim.heading, view, sim.shape);
  };

  function drawGrid(ctx, view){
    ctx.save();
    ctx.strokeStyle = 'rgba(16,185,129,.10)';
    ctx.lineWidth = 1;
    const step = 50 * view.scale;
    if(step > 6){
      let sx = view.cx % step;
      for(let x = sx; x < view.w; x += step){
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, view.h); ctx.stroke();
      }
      let sy = view.cy % step;
      for(let y = sy; y < view.h; y += step){
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(view.w, y); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function animate(){
    const cv = $('#turtleCanvas'), ov = $('#turtleOverlay');
    const {w,h,ctx} = fitCanvas(cv);
    const {w:ow,h:oh} = fitCanvas(ov);
    const octx = ov.getContext('2d');
    ctx.fillStyle = sim.bgcolor || '#ffffff';
    ctx.fillRect(0,0,w,h);
    const view = computeView(sim, w, h);
    drawGrid(ctx, view);

    const ops = sim.ops;
    let i = 0;
    const total = ops.length;
    let perFrame = 1;
    if(total > 4000) perFrame = Math.ceil(total / 60);
    else if(total > 800) perFrame = Math.ceil(total / 90);
    else perFrame = 2;

    // соңғы позицияларды алу үшін трек
    let curX = 0, curY = 0, curH = 0;

    const step = () => {
      const end = Math.min(i + perFrame, total);
      for(; i < end; i++){
        const op = ops[i];
        drawOne(ctx, op, view);
        if(op.type === 'line'){ curX = op.x2; curY = op.y2; curH = op.h; }
        else if(op.type === 'dot' || op.type === 'text'){ curX = op.x; curY = op.y; }
      }
      octx.clearRect(0,0,ow,oh);
      if(i < total) drawTurtleMarker(octx, curX, curY, curH, view, sim.shape);
      else drawTurtleMarker(octx, sim.x, sim.y, sim.heading, view, sim.shape);
      if(i < total){
        animHandle = requestAnimationFrame(step);
      } else {
        animHandle = null;
      }
    };
    step();
  }

  $('#runBtn').addEventListener('click', run);
  $('#resetBtn').addEventListener('click', () => {
    ta.value = TEMPLATES['Шаршы'];
    localStorage.setItem('dl_code', ta.value);
    sim = new TurtleSim();
    if(animHandle) cancelAnimationFrame(animHandle);
    renderStatic();
    $('#console').innerHTML = '// Бастапқы код қалпына келтірілді';
  });
  $('#clearBtn').addEventListener('click', () => {
    sim.ops = []; sim.x = 0; sim.y = 0; sim.heading = 0;
    if(animHandle) cancelAnimationFrame(animHandle);
    renderStatic();
    $('#console').innerHTML = '// Алаң тазаланды';
  });
  $('#pngBtn').addEventListener('click', () => {
    const cv = $('#turtleCanvas');
    const tmp = document.createElement('canvas');
    tmp.width = cv.width; tmp.height = cv.height;
    const tc = tmp.getContext('2d');
    tc.drawImage(cv, 0, 0);
    const ov = $('#turtleOverlay');
    tc.drawImage(ov, 0, 0);
    const a = document.createElement('a');
    a.download = 'turtle-suret.png';
    a.href = tmp.toDataURL('image/png');
    a.click();
    const c = $('#console');
    const d = document.createElement('div');
    d.className = 'ok';
    d.textContent = '💾 Сурет PNG ретінде сақталды!';
    c.appendChild(d);
  });

  // Алғашқы салу
  requestAnimationFrame(() => {
    sim = new TurtleSim();
    renderStatic();
    try{ run(); }catch(e){}
  });

  window.addEventListener('resize', () => { if(sim) renderStatic(); });
}

/* ---------- Кесте редакторы ---------- */
class TableModel{
  constructor(rows, cols){
    this.rows = rows; this.cols = cols;
    this.cells = [];
    this.reset(rows, cols);
  }
  reset(rows, cols){
    this.rows = rows; this.cols = cols; this.cells = [];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
      this.cells.push({id:'c'+r+'_'+c, r, c, rs:1, cs:1, text:'', bg:'', align:'left'});
  }
  grid(){
    const g = Array.from({length:this.rows}, () => Array(this.cols).fill(null));
    for(const cell of this.cells){
      for(let r=cell.r; r<cell.r+cell.rs; r++)
        for(let c=cell.c; c<cell.c+cell.cs; c++)
          if(r < this.rows && c < this.cols) g[r][c] = cell;
    }
    return g;
  }
  find(r,c){
    const g = this.grid();
    return (g[r] && g[r][c]) || null;
  }
  merge(ids){
    if(ids.length < 2) return;
    const sel = this.cells.filter(c => ids.includes(c.id));
    if(!sel.length) return;
    let minR = Infinity, minC = Infinity, maxR = -Infinity, maxC = -Infinity;
    sel.forEach(c => {
      minR = Math.min(minR, c.r); minC = Math.min(minC, c.c);
      maxR = Math.max(maxR, c.r + c.rs - 1); maxC = Math.max(maxC, c.c + c.cs - 1);
    });
    const keep = this.find(minR, minC);
    if(!keep) return;
    const rs = maxR - minR + 1, cs = maxC - minC + 1;
    this.cells = this.cells.filter(c => {
      if(c === keep) return true;
      const overlap = !(c.r + c.rs - 1 < minR || c.r > maxR || c.c + c.cs - 1 < minC || c.c > maxC);
      return !overlap;
    });
    keep.r = minR; keep.c = minC; keep.rs = rs; keep.cs = cs;
    this.cells.push({id:'c'+minR+'_'+minC+'_x', r:minR, c:minC, rs:1, cs:1, text:'', bg:'', align:'left'});
    this.cells = this.cells.filter(c => c !== this.cells[this.cells.length-1]);
  }
  split(cellId){
    const cell = this.cells.find(c => c.id === cellId);
    if(!cell || (cell.rs === 1 && cell.cs === 1)) return;
    const {r, c, rs, cs} = cell;
    cell.rs = 1; cell.cs = 1;
    for(let i=r;i<r+rs;i++) for(let j=c;j<c+cs;j++){
      if(i === r && j === c) continue;
      this.cells.push({id:'c'+i+'_'+j+'_'+Math.random().toString(36).slice(2,7),
                       r:i, c:j, rs:1, cs:1, text:'', bg:'', align:'left'});
    }
  }
  addRow(){
    const r = this.rows;
    for(let c=0;c<this.cols;c++)
      this.cells.push({id:'c'+r+'_'+c+'_'+Math.random().toString(36).slice(2,7), r, c, rs:1, cs:1, text:'', bg:'', align:'left'});
    this.rows++;
  }
  addCol(){
    const c = this.cols;
    for(let r=0;r<this.rows;r++)
      this.cells.push({id:'c'+r+'_'+c+'_'+Math.random().toString(36).slice(2,7), r, c, rs:1, cs:1, text:'', bg:'', align:'left'});
    this.cols++;
  }
  delRow(){
    if(this.rows <= 1) return;
    this.rows--;
    this.cells = this.cells.filter(c => c.r < this.rows);
    this.cells.forEach(c => { if(c.r + c.rs > this.rows) c.rs = Math.max(1, this.rows - c.r); });
  }
  delCol(){
    if(this.cols <= 1) return;
    this.cols--;
    this.cells = this.cells.filter(c => c.c < this.cols);
    this.cells.forEach(c => { if(c.c + c.cs > this.cols) c.cs = Math.max(1, this.cols - c.c); });
  }
}

let tbl = null, tblSel = new Set();

function pageTables(){
  tbl = new TableModel(4, 4);
  // демо мазмұн
  const demo = [['Күні','1-сабақ','2-сабақ','3-сабақ'],
                ['Дүйсенбі','Математика','Қазақ тілі','Информатика'],
                ['Сейсенбі','Физика','Тарих','Ағылшын тілі'],
                ['Сәрсенбі','Информатика','Математика','Дене шынықтыру']];
  const g = tbl.grid();
  demo.forEach((row, r) => row.forEach((v, c) => { if(g[r] && g[r][c]) g[r][c].text = v; }));
  if(g[0]) g[0].forEach(cell => { if(cell) cell.bg = '#d1fae5'; });

  app.innerHTML = `
  <div class="page-head">
    <h2>📊 Кесте редакторы</h2>
    <p>Ұяшықты басып таңдаңыз, Shift пернесімен бірнеше ұяшық таңдауға болады.</p>
  </div>
  <div class="toolbar">
    <button id="tAddRow">➕ Жол қосу</button>
    <button id="tAddCol">➕ Баған қосу</button>
    <button id="tDelRow">➖ Жол өшіру</button>
    <button id="tDelCol">➖ Баған өшіру</button>
    <button id="tMerge">🔗 Біріктіру</button>
    <button id="tSplit">✂️ Бөлу</button>
    <input type="color" id="tBg" value="#d1fae5" title="Ұяшық фоны">
    <button id="tBgApply">🎨 Фонды бояу</button>
    <button id="tBgClear">🧽 Фонды тазалау</button>
    <button id="tAlignL">⬅️ Солға</button>
    <button id="tAlignC">↔️ Ортаға</button>
    <button id="tReset">↺ Қайта бастау</button>
  </div>
  <div style="overflow:auto;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px">
    <table class="editor" id="tblEl"></table>
  </div>
  <div class="msg" id="tblMsg" style="margin-top:12px"></div>`;

  drawTable();

  function drawTable(){
    const g = tbl.grid();
    const tblEl = $('#tblEl');
    let html = '<tbody>';
    for(let r=0;r<tbl.rows;r++){
      html += '<tr>';
      for(let c=0;c<tbl.cols;c++){
        const cell = g[r][c];
        if(!cell) continue;
        if(cell.r !== r || cell.c !== c) continue;
        const sel = tblSel.has(cell.id) ? ' sel' : '';
        html += `<td data-id="${cell.id}" rowspan="${cell.rs}" colspan="${cell.cs}"
          contenteditable="true" class="${sel}"
          style="background:${cell.bg||'#fff'};text-align:${cell.align}">${esc(cell.text)}</td>`;
      }
      html += '</tr>';
    }
    html += '</tbody>';
    tblEl.innerHTML = html;
  }

  let lastCell = null;
  $('#tblEl').addEventListener('click', e => {
    const td = e.target.closest('td');
    if(!td) return;
    const id = td.dataset.id;
    if(e.shiftKey && lastCell){
      // тіктөртбұрыш диапазон таңдау
      const g = tbl.grid();
      const a = tbl.cells.find(c => c.id === lastCell);
      const b = tbl.cells.find(c => c.id === id);
      if(a && b){
        tblSel.clear();
        const r1 = Math.min(a.r,b.r), r2 = Math.max(a.r+a.rs-1, b.r+b.rs-1);
        const c1 = Math.min(a.c,b.c), c2 = Math.max(a.c+a.cs-1, b.c+b.cs-1);
        for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
          const cc = g[r] && g[r][c];
          if(cc) tblSel.add(cc.id);
        }
      }
    } else {
      tblSel.clear();
      tblSel.add(id);
      lastCell = id;
    }
    drawTable();
  });
  $('#tblEl').addEventListener('input', e => {
    const td = e.target.closest('td');
    if(!td) return;
    const cell = tbl.cells.find(c => c.id === td.dataset.id);
    if(cell) cell.text = td.innerHTML;
  });
  $('#tblEl').addEventListener('blur', e => {
    const td = e.target.closest('td');
    if(td) drawTable();
  }, true);

  const msg = (t, ok) => {
    const m = $('#tblMsg');
    m.className = 'result-msg ' + (ok ? 'ok' : 'no');
    m.textContent = t;
    setTimeout(() => { m.className = 'msg'; m.textContent = ''; }, 3200);
  };

  $('#tAddRow').addEventListener('click', () => { tbl.addRow(); drawTable(); });
  $('#tAddCol').addEventListener('click', () => { tbl.addCol(); drawTable(); });
  $('#tDelRow').addEventListener('click', () => { tbl.delRow(); drawTable(); });
  $('#tDelCol').addEventListener('click', () => { tbl.delCol(); drawTable(); });

  $('#tMerge').addEventListener('click', () => {
    if(tblSel.size < 2){ msg('Кемінде 2 ұяшық таңдаңыз (Shift арқылы).', false); return; }
    // біріктіру: барлығын бір ұяшыққа
    const g = tbl.grid();
    const sel = tbl.cells.filter(c => tblSel.has(c.id));
    let minR = Infinity, minC = Infinity, maxR = -Infinity, maxC = -Infinity;
    sel.forEach(c => {
      minR = Math.min(minR, c.r); minC = Math.min(minC, c.c);
      maxR = Math.max(maxR, c.r + c.rs - 1); maxC = Math.max(maxC, c.c + c.cs - 1);
    });
    const keep = g[minR] && g[minR][minC];
    if(!keep){ msg('Біріктіру мүмкін болмады.', false); return; }
    const rs = maxR - minR + 1, cs = maxC - minC + 1;
    tbl.cells = tbl.cells.filter(c => {
      if(c === keep) return true;
      const ov = !(c.r + c.rs - 1 < minR || c.r > maxR || c.c + c.cs - 1 < minC || c.c > maxC);
      return !ov;
    });
    keep.r = minR; keep.c = minC; keep.rs = rs; keep.cs = cs;
    tblSel.clear(); tblSel.add(keep.id);
    drawTable();
    Store.add('ach','a5');
    checkAchievements();
    msg('🔗 Ұяшықтар біріктірілді!', true);
  });

  $('#tSplit').addEventListener('click', () => {
    if(tblSel.size !== 1){ msg('Бір ұяшық таңдаңыз.', false); return; }
    const id = [...tblSel][0];
    tbl.split(id);
    tblSel.clear();
    drawTable();
    msg('✂️ Ұяшық бөлінді!', true);
  });

  $('#tBgApply').addEventListener('click', () => {
    const col = $('#tBg').value;
    tbl.cells.forEach(c => { if(tblSel.has(c.id)) c.bg = col; });
    drawTable();
    Store.add('ach','a5'); checkAchievements();
    msg('🎨 Фон түсі өзгертілді!', true);
  });
  $('#tBgClear').addEventListener('click', () => {
    tbl.cells.forEach(c => { if(tblSel.has(c.id)) c.bg = ''; });
    drawTable();
  });
  $('#tAlignL').addEventListener('click', () => {
    tbl.cells.forEach(c => { if(tblSel.has(c.id)) c.align = 'left'; }); drawTable();
  });
  $('#tAlignC').addEventListener('click', () => {
    tbl.cells.forEach(c => { if(tblSel.has(c.id)) c.align = 'center'; }); drawTable();
  });
  $('#tReset').addEventListener('click', () => { pageTables(); });
}

function pageTest(id){
  const test = TESTS[id];
  if(!test){ app.innerHTML = '<div class="card"><p>Тест табылмады.</p></div>'; return; }
  let idx = 0, score = 0, answered = false;
  const total = test.qs.length;

  const render = () => {
    if(idx >= total){ finish(); return; }
    const q = test.qs[idx];
    app.innerHTML = `
      <div class="page-head">
        <h2>📝 ${esc(test.title)}</h2>
        <p>Сұрақ ${idx+1} / ${total} · Дұрыс жауап: ${score}</p>
      </div>
      <div class="progress-bar"><div style="width:${idx/total*100}%"></div></div>
      <div class="card">
        <h3 style="font-size:17px;color:var(--text)">${esc(q[0])}</h3>
        <div id="opts" style="margin-top:14px"></div>
        <div id="fb"></div>
        <div class="btn-row" id="nav" style="display:none">
          <button class="btn" id="nextBtn">${idx+1 === total ? 'Аяқтау' : 'Келесі сұрақ →'}</button>
        </div>
      </div>`;
    const opts = $('#opts');
    q[1].forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = String.fromCharCode(65 + i) + ') ' + o;
      b.addEventListener('click', () => {
        if(answered) return;
        answered = true;
        $$('.opt', opts).forEach((x, j) => {
          x.disabled = true;
          if(j === q[2]) x.classList.add('correct');
        });
        if(i === q[2]) score++;
        else b.classList.add('wrong');
        const fb = $('#fb');
        fb.className = 'result-msg ' + (i === q[2] ? 'ok' : 'no');
        fb.textContent = (i === q[2] ? '✅ Дұрыс! ' : '❌ Қате. ') + q[3];
        $('#nav').style.display = 'flex';
      });
      opts.appendChild(b);
    });
  };

  const finish = () => {
    const pct = Math.round(score/total*100);
    const d = Store.data;
    d.tests[id] = {score, total, pct, date: new Date().toLocaleDateString('kk-KZ')};
    Store.save();
    if(id === 't10' && pct >= 70) Store.add('ach','a6');
    checkAchievements();
    app.innerHTML = `
      <div class="card" style="text-align:center;padding:36px">
        <h2 style="color:var(--emerald-dark)">Тест аяқталды!</h2>
        <p style="font-size:44px;font-weight:800;color:var(--emerald);margin:14px 0">${score} / ${total}</p>
        <p style="font-size:19px">${pct}%</p>
        <p style="margin-top:10px">${pct >= 90 ? '🌟 Керемет нәтиже!' : pct >= 70 ? '👍 Жақсы!' : pct >= 50 ? '🙂 Жақсы, тағы жаттығып көр!' : '📚 Тақырыпты қайталап, қайта тапсырып көр.'}</p>
        <div class="btn-row" style="justify-content:center">
          <a class="btn" href="#/test/${id}">🔄 Қайта тапсыру</a>
          <a class="btn sec" href="#/tests">← Тесттер тізімі</a>
          <a class="btn cy" href="#/results">📈 Нәтижелерім</a>
        </div>
      </div>`;
  };

  render();
  // «Келесі» батырмасын делегат арқылы өңдеу
  app.addEventListener('click', e => {
    if(e.target.closest('#nextBtn')){
      idx++; answered = false;
      render();
    }
  });
}

        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border)">
          <span>${esc(t.num)} · ${esc(t.title)}</span>
          <span>${d.topics.includes(t.id) ? '<span class="badge" style="background:var(--emerald);color:#fff">✓ Аяқталды</span>' : '<span class="badge ye">Басталмаған</span>'}</span>
        </div>`).join('')}
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>📝 Тест нәтижелері</h3>
    ${testsDone === 0 ? '<p style="color:var(--muted)">Әлі тест тапсырылмаған.</p>' :
      Object.keys(TESTS).map(k => {
        const r = d.tests[k];
        if(!r) return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);color:var(--muted)">
          <span>${esc(TESTS[k].title)}</span><span>—</span></div>`;
        return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border)">
          <span>${esc(TESTS[k].title)}</span>
          <span><b style="color:${r.pct>=70?'var(--emerald)':'#ea580c'}">${r.score}/${r.total} (${r.pct}%)</b></span></div>`;
      }).join('')}
    ${d.final ? `<p style="margin-top:12px"><b>🏁 Қорытынды тест:</b> ${d.final.score}/${d.final.total} (${d.final.pct}%) — ${finalGrade(d.final.pct)}</p>` : ''}
  </div>

  <div class="card" style="margin-top:16px">
    <h3>🛠️ Практикалық жұмыстар</h3>
    ${d.practice.length === 0 ? '<p style="color:var(--muted)">Әлі орындалмаған.</p>' :
      PRACTICE.filter(p => d.practice.includes(p.id)).map(p => `<p>✓ ${esc(p.title)}</p>`).join('')}
  </div>

  <div class="btn-row" style="margin-top:18px">
    <a class="btn" href="#/home">🏠 Басты бетке</a>
    <button class="btn sec" id="resetAll">🗑️ Прогресті тазалау</button>
  </div>`;

  $('#resetAll').addEventListener('click', () => {
    if(confirm('Барлық прогресті тазалауға сенімдісің бе?')){
      localStorage.removeItem(Store.key);
      localStorage.removeItem('dl_code');
      localStorage.removeItem('dl_doc');
      Store.load(); Store.updateChips();
      location.hash = '/home';
      render();
    }
  });
}

/* =========================================================================
   10. РОУТЕР
   ========================================================================= */
function render(){
  const hash = location.hash.slice(1) || '/home';
  const parts = hash.split('/').filter(Boolean);
  const base = '/' + (parts[0] || 'home');
  markNav();
  window.scrollTo(0, 0);

  try{
    switch(base){
      case '/home': pageHome(); break;
      case '/python': pageTopicList('py'); break;
      case '/docs': pageTopicList('doc'); break;
      case '/topic': pageTopic(parts[1]); break;
      case '/editor': pageEditor(); break;
      case '/practice': pagePractice(); break;
      case '/doceditor': pageDocEditor(); break;
      case '/tables': pageTables(); break;
      case '/tests': pageTests(); break;
      case '/test': pageTest(parts[1]); break;
      case '/final': pageFinal(); break;
      case '/results': pageResults(); break;
      default: pageHome();
    }
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="card"><h3>Қате орын алды</h3><p>${esc(err.message)}</p>
      <div class="btn-row"><a class="btn" href="#/home">🏠 Басты бетке</a></div></div>`;
  }
  Store.updateChips();
}

/* =========================================================================
   11. ІСКЕ ҚОСУ
   ========================================================================= */
Store.load();
Store.updateChips();
buildNav();
window.addEventListener('hashchange', render);
if(!location.hash) location.hash = '/home';
render();
</script>
</body>
</html>
